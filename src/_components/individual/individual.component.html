<table mat-table [dataSource]="dataSrc" >
    <ng-container matColumnDef="id" >
        <th mat-header-cell *matHeaderCellDef >No.</th>
        <td mat-cell *matCellDef="let element" > {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="name" >
        <th mat-header-cell *matHeaderCellDef >Name</th>
        <td mat-cell *matCellDef="let element" > {{ element.name }} </td>
    </ng-container>

    <ng-container matColumnDef="email" >
        <th mat-header-cell *matHeaderCellDef >Email</th>
        <td mat-cell *matCellDef="let element" > {{ element.email }} 
            <button mat-stroked-button class="bg-success text-white" routerLink="/list/update/{{element.id}}" >Update</button>
            <button mat-stroked-button class="bg-secondary text-white" (click)="deteleRow()" >Delete</button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumn" ></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumn" ></tr>

</table>
